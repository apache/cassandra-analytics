plugins {
    id('java-library')
}

configurations {
    all*.exclude(group: 'org.slf4j', module: 'slf4j-log4j12')
    all*.exclude(group: 'log4j', module: 'log4j')
    implCassV5
}

dependencies {
    implCassV5 project(':cassandra-analytics-spark-five-zero-converter')
    compileOnly project(":cassandra-analytics-common")
    compileOnly project(":cassandra-six-zero-types")
    compileOnly project(":cassandra-analytics-spark-converter")
    compileOnly(project(path: ':cassandra-six-zero', configuration: 'shadow'))
    compileOnly(group: "${sparkGroupId}", name: "spark-core_${scalaMajorVersion}", version: "${project.rootProject.sparkVersion}")
    compileOnly(group: "${sparkGroupId}", name: "spark-sql_${scalaMajorVersion}", version: "${project.rootProject.sparkVersion}")
}

jar {
    archiveFileName = "six-zero-sparksql.jar"
    dependsOn ':cassandra-analytics-spark-five-zero-converter:build'
    // copy classes from the V5 implementation and exclude duplicates that we override
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.implCassV5.collect { it.isDirectory() ? it : zipTree(it) } }
}
