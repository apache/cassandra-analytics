apply from: "${project.rootDir}/gradle/common/java11Options.gradle"
apply from: "${project.rootDir}/gradle/common/java17Options.gradle"

project.ext.JDK_OPTIONS = project.ext.JDK11_OPTIONS

if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    project.ext.JDK_OPTIONS += project.ext.JDK17_OPTIONS
}
