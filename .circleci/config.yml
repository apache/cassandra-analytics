version: 2.1
commands:
  install_common:
    steps:
      - run: sudo apt-get update
        # Somehow, the certs already installed in the java 11 image are installed strangely
        # in that there's a directory called `cacerts` with a symlink in it named `cacerts`
        # (/etc/ssl/certs/java/cacerts/cacerts) rather than just a symlink to
        # `cacerts` in the /etc/ssl/certs/java directory - if this is the case, fix it by
        # moving it down a directory and then ant should install cleanly
      - run: |
          if [ -f /etc/ssl/certs/java/cacerts/cacerts ]; then
              sudo mv /etc/ssl/certs/java/cacerts/ /etc/ssl/certs/java/cacerts-old
              sudo mv /etc/ssl/certs/java/cacerts-old/cacerts /etc/ssl/certs/java/
              sudo rmdir /etc/ssl/certs/java/cacerts-old
          fi
        # The image already has java installed, but `apt-get install ant` reinstalls it.
        # Therefore, we download just the deb package for ant and install it with dpkg.
      - run: |
          apt-get download ant ant-optional
          sudo dpkg --force-all -i ant*.deb
          rm ant*.deb
      # We need aliases for localhost2,localhost3, ..., localhost20 in hosts
      - run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          cat /etc/hosts
  run_build:
    parameters:
      spark:
        type: string
      scala:
        type: string
      jdk:
        type: string
      sstable_format:
        type: string
        default: "big"
      cassandra:
        type: string
        default: ""
    description: Build and test against Spark <<parameters.spark>> Scala <<parameters.scala>> <<parameters.jdk>>
    steps:
      - run:
          environment:
            SPARK_VERSION: "<<parameters.spark>>"
            SCALA_VERSION: "<<parameters.scala>>"
            JDK_VERSION: "<<parameters.jdk>>"
            INTEGRATION_MAX_PARALLEL_FORKS: 1
            INTEGRATION_MAX_HEAP_SIZE: "3072m"
            CORE_MAX_PARALLEL_FORKS: 3
            CORE_TEST_MAX_HEAP_SIZE: "2048m"
            CASSANDRA_VERSION: "<<parameters.cassandra>>"
          command: |
            export GRADLE_OPTS="-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
            # Run compile/unit tests, skipping integration tests
            ./gradlew --no-daemon --max-workers=2 --stacktrace clean assemble check -x cassandra-analytics-integration-tests:test -Dcassandra.analytics.bridges.sstable_format=<<parameters.sstable_format>>

  run_integration:
    parameters:
      spark:
        type: string
      scala:
        type: string
      jdk:
        type: string
      cassandra:
        type: string
    description: Build and integration test against Spark <<parameters.spark>> Scala <<parameters.scala>> <<parameters.jdk>>
    steps:
      - run:
          environment:
            SPARK_VERSION: "<<parameters.spark>>"
            SCALA_VERSION: "<<parameters.scala>>"
            JDK_VERSION: "<<parameters.jdk>>"
            INTEGRATION_MAX_PARALLEL_FORKS: 1
            INTEGRATION_MAX_HEAP_SIZE: "3072M"
          command: |
            export GRADLE_OPTS="-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
            export DTEST_JAR="dtest-<< parameters.cassandra >>.jar"
            export CASSANDRA_VERSION=$(echo << parameters.cassandra >> | cut -d'.' -f 1,2)
            # Run compile but not unit tests (which are run in run_build)
            ./gradlew --no-daemon --max-workers=2 --stacktrace clean assemble
            # Run integration tests in parallel
            cd cassandra-analytics-integration-tests/src/test/java
            # Get list of classnames of tests that should run on this node
            # NOTE: This assumes all actual tests suites end in "Test.java"
            # AND NO OTHER FILES do, so "BaseTest" classes were renamed to
            # "TestBase"
            CLASSNAMES=$(circleci tests glob "**/*Test.java" \
            | cut -c 1- | sed 's@/@.@g' \
            | sed 's/.\{5\}$//' \
            | circleci tests split --split-by=timings --timings-type=classname)
            cd ../../../..
            # Format the arguments to "./gradlew test"
            # GRADLE_ARGS=$(echo $CLASSNAMES | awk '{for (i=1; i<=NF; i++) print "--tests",$i}')
            echo "CircleCI assigned the following classes for testing: $CLASSNAMES"
            # Each test class runs in its own ./gradlew invocation. Gradle treats
            # build/test-reports/integration/ as a task output and wipes stale
            # files on each run, so without aggregation only the last class's XML
            # would survive, hiding most results from the CircleCI dashboard.
            # Drain reports into a per-class subdirectory after each iteration.
            SRC_REPORT_DIR="$(pwd)/build/test-results/cassandra-analytics-integration-tests/test"
            HTML_REPORT_DIR="$(pwd)/build/reports/tests/cassandra-analytics-integration-tests/test"
            AGG_ROOT="$(pwd)/build/aggregated-test-reports/integration"
            mkdir -p "$AGG_ROOT"
            # collect up exit statuses for all of the test classes and exit with that result at the end.
            # If no gradle processes exit with non-zero status, it will still be 0
            EXIT_STATUS=0
            for TEST_NAME in $CLASSNAMES; do
                ./gradlew --stacktrace cassandra-analytics-integration-tests:test --tests $TEST_NAME --no-daemon || EXIT_STATUS=$?;
                DEST="$AGG_ROOT/$TEST_NAME"
                mkdir -p "$DEST"
                MOVED=0
                if [ -d "$SRC_REPORT_DIR" ]; then
                    for f in "$SRC_REPORT_DIR"/TEST-*.xml; do
                        [ -e "$f" ] || continue
                        mv "$f" "$DEST"/
                        MOVED=1
                    done
                fi
                if [ -d "$HTML_REPORT_DIR" ]; then
                    mkdir -p "$DEST/html"
                    cp -r "$HTML_REPORT_DIR/." "$DEST/html/"
                fi
                # If Gradle produced no XML (e.g. class-level crash before any
                # @Test ran), synthesize a minimal JUnit record so CircleCI's
                # dashboard still surfaces that the shard attempted the class.
                if [ "$MOVED" = "0" ]; then
                    MSG="Gradle produced no JUnit XML for $TEST_NAME; likely a class-level crash before tests ran. Exit status: $EXIT_STATUS. See job artifacts for full logs."
                    {
                      printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
                      printf '<testsuite name="%s" tests="1" failures="1" errors="0" skipped="0">\n' "$TEST_NAME"
                      printf '  <testcase classname="%s" name="noJUnitReportProduced">\n' "$TEST_NAME"
                      printf '    <failure message="%s">%s</failure>\n' "$MSG" "$MSG"
                      printf '  </testcase>\n'
                      printf '</testsuite>\n'
                    } > "$DEST/TEST-${TEST_NAME}.xml"
                fi
            done;
            exit $EXIT_STATUS
          no_output_timeout: 30m

jobs:
  build-deps-jdk11:
    docker:
      - image: cimg/openjdk:11.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - run:
          name: Build dependencies for JDK11 builds
          environment:
            CASSANDRA_USE_JDK11: "true"
            # Set JDK_VERSION, SPARK_VERSION, and SCALA_VERSION for codeCheckTasks
            JDK_VERSION: "11"
            SPARK_VERSION: "3"
            SCALA_VERSION: "2.12"
          command: |
            ./scripts/build-dependencies.sh
            ./gradlew --no-daemon --max-workers=2 codeCheckTasks
      - persist_to_workspace:
          root: dependencies
          paths:
            - "*.jar"
            - "org/**/*"

  # JDK17 dependency build for the Spark 4 / Scala 2.13 matrix.
  # Workspace paths overlap with build-deps-jdk11, so any downstream job must
  # `requires:` only ONE of these two — never both — to avoid jar collisions.
  build-deps-jdk17:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - run:
          name: Build dependencies for JDK17 builds
          environment:
            # Set JDK_VERSION, SPARK_VERSION, and SCALA_VERSION for codeCheckTasks
            JDK_VERSION: "17"
            SPARK_VERSION: "4"
            SCALA_VERSION: "2.13"
            # JDK17 only targets Cassandra 5.0+; skip 4.0 / 4.1 dtest jar builds
            # (build-dtest-jars.sh reads this var to filter CANDIDATE_BRANCHES).
            BRANCHES: "cassandra-5.0"
          command: |
            ./scripts/build-dependencies.sh
            ./gradlew --no-daemon --max-workers=2 codeCheckTasks
      - persist_to_workspace:
          root: dependencies
          paths:
            - "*.jar"
            - "org/**/*"

  # Single parameterized unit-test job. The workflow invokes it via `matrix:`
  # multiple times, once per "compatibility group" (e.g. C4.x + Scala 2.12 + BIG,
  # C5.0 + Scala 2.13 + BTI). Splitting into several small matrices is cleaner
  # than one big matrix with a long `exclude:` list, because CircleCI's
  # `exclude:` requires every parameter to be listed in every entry.
  unit:
    parameters:
      spark:
        type: string
      scala:
        type: string
      jdk:
        type: string
      cassandra:
        type: string
      sstable_format:
        type: string
    docker:
      - image: cimg/openjdk:<<parameters.jdk>>.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - attach_workspace:
          at: dependencies
      - run_build:
          spark: "<<parameters.spark>>"
          scala: "<<parameters.scala>>"
          jdk: "<<parameters.jdk>>"
          sstable_format: "<<parameters.sstable_format>>"
          cassandra: "<<parameters.cassandra>>"

      - store_artifacts:
          when: always
          path: build/test-results
          destination: test-results

      - store_artifacts:
          when: always
          path: build/reports
          destination: reports

      - store_test_results:
          when: always
          path: build/test-results

  # Single parameterized integration-test job, invoked once per Cassandra/Scala
  # compatibility group from the workflow's `matrix:` block.
  int-test:
    parameters:
      spark:
        type: string
      scala:
        type: string
      jdk:
        type: string
      cassandra:
        type: string
    parallelism: 8
    docker:
      - image: cimg/openjdk:<<parameters.jdk>>.0
    resource_class: large
    steps:
      - setup_remote_docker
      - install_common
      - checkout
      - attach_workspace:
          at: dependencies
      - run_integration:
          spark: "<<parameters.spark>>"
          scala: "<<parameters.scala>>"
          jdk: "<<parameters.jdk>>"
          cassandra: "<<parameters.cassandra>>"

      - store_artifacts:
          when: always
          path: build/aggregated-test-reports
          destination: test-results

      - store_artifacts:
          when: always
          path: build/reports
          destination: reports

      - store_artifacts:
          when: always
          path: cassandra-analytics-integration-tests
          destination: int-tests-misc

      - store_test_results:
          when: always
          path: build/aggregated-test-reports

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-deps-jdk11
      - build-deps-jdk17

      # ---- Unit tests ----
      # Cassandra 4.x: Scala 2.12 + BIG sstable format
      - unit:
          requires:
            - build-deps-jdk11
          matrix:
            alias: unit-c4x
            parameters:
              spark: ["3"]
              scala: ["2.12"]
              jdk: ["11"]
              sstable_format: ["big"]
              cassandra: ["4.0", "4.1"]

      # Cassandra 5.0: Scala 2.13 + BTI sstable format
      - unit:
          requires:
            - build-deps-jdk11
          matrix:
            alias: unit-c5
            parameters:
              spark: ["3"]
              scala: ["2.13"]
              jdk: ["11"]
              sstable_format: ["bti"]
              cassandra: ["5.0"]

      # Cassandra 5.0 on Spark 4 / Scala 2.13 / JDK 17 + BTI sstable format
      - unit:
          requires:
            - build-deps-jdk17
          matrix:
            alias: unit-c5-spark4
            parameters:
              spark: ["4"]
              scala: ["2.13"]
              jdk: ["17"]
              sstable_format: ["bti"]
              cassandra: ["5.0"]

      # ---- Integration tests ----
      # Cassandra 4.x: Scala 2.12, full patch versions for dtest jar lookup
      - int-test:
          requires:
            - build-deps-jdk11
          matrix:
            alias: int-c4x
            parameters:
              spark: ["3"]
              scala: ["2.12"]
              jdk: ["11"]
              cassandra: ["4.0.17", "4.1.4"]

      # Cassandra 5.0: Scala 2.13
      - int-test:
          requires:
            - build-deps-jdk11
          matrix:
            alias: int-c5
            parameters:
              spark: ["3"]
              scala: ["2.13"]
              jdk: ["11"]
              cassandra: ["5.0.5"]

      # Cassandra 5.0 on Spark 4 / Scala 2.13 / JDK 17
      - int-test:
          requires:
            - build-deps-jdk17
          matrix:
            alias: int-c5-spark4
            parameters:
              spark: ["4"]
              scala: ["2.13"]
              jdk: ["17"]
              cassandra: ["5.0.5"]
