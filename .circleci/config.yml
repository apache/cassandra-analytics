workflows:
  version: 2
  build-and-test:
    jobs:
      - build-deps-jdk11

      # Unit tests: split by Cassandra version to reduce per-process memory pressure
      - spark3-2_12-jdk11-big-c40:
          requires:
            - build-deps-jdk11
      - spark3-2_12-jdk11-big-c50:
          requires:
            - build-deps-jdk11
      - spark3-2_13-jdk11-big-c40:
          requires:
            - build-deps-jdk11
      - spark3-2_13-jdk11-big-c50:
          requires:
            - build-deps-jdk11
      - spark3-2_13-jdk11-bti-c50:
          requires:
            - build-deps-jdk11

      # Integration tests
      - int-c4-spark3-2_12-jdk11:
          requires:
            - build-deps-jdk11
      - int-c4-spark3-2_13-jdk11:
          requires:
            - build-deps-jdk11
      - int-c5-spark3-2_13-jdk11:
          requires:
            - build-deps-jdk11
